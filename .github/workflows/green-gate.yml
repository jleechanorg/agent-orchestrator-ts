name: Green Gate

# Canonical /green: current-head CI success plus live mergeability.
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
        type: string
      head_sha:
        description: "Expected PR head commit SHA"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  green_gate:
    name: Green Gate
    runs-on: [self-hosted]
    permissions:
      pull-requests: write
      issues: write
      contents: read
      checks: read
    steps:
      - name: Run two-gate checks
        id: gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.inputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          set +e
          FAILED_GATES=""
          GATE_ROWS=""

          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/"$PR_NUM" 2>/dev/null || echo '{}')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha // empty')
          if [ -z "$HEAD_SHA" ]; then
            echo "ERROR: could not determine current HEAD SHA for PR #$PR_NUM"
            exit 1
          fi
          if [ "$EXPECTED_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "ERROR: expected SHA ${EXPECTED_HEAD_SHA:0:12} is stale; current HEAD is ${HEAD_SHA:0:12}"
            exit 1
          fi
          echo "Checking PR #$PR_NUM at current HEAD ${HEAD_SHA:0:12}"

          # Gate 1: every latest non-advisory, non-self context in GitHub's
          # statusCheckRollup must be terminal and successful. This includes
          # both CheckRun.conclusion and legacy StatusContext.state.
          MAX_WAIT=900
          INTERVAL=30
          ELAPSED=0
          STABLE_SUCCESS_SNAPSHOTS=0
          LAST_SUCCESS_SIGNATURE=""
          REPOSITORY="${{ github.repository }}"
          REPOSITORY_OWNER="${REPOSITORY%%/*}"
          REPOSITORY_NAME="${REPOSITORY#*/}"
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            if [ "$ELAPSED" -eq 0 ]; then
              sleep 10
              ELAPSED=10
            else
              sleep "$INTERVAL"
              ELAPSED=$((ELAPSED + INTERVAL))
            fi

            # GraphQL variables expand server-side rather than in this shell.
            # shellcheck disable=SC2016
            ROLLUP_PAGES=$(gh api graphql --paginate --slurp \
              -F owner="$REPOSITORY_OWNER" \
              -F name="$REPOSITORY_NAME" \
              -F sha="$HEAD_SHA" \
              -f query='
                query(
                  $owner: String!,
                  $name: String!,
                  $sha: GitObjectID!,
                  $endCursor: String
                ) {
                  repository(owner: $owner, name: $name) {
                    object(oid: $sha) {
                      ... on Commit {
                        statusCheckRollup {
                          contexts(first: 100, after: $endCursor) {
                            nodes {
                              __typename
                              ... on CheckRun {
                                name
                                status
                                conclusion
                                startedAt
                                checkSuite { app { slug } }
                              }
                              ... on StatusContext {
                                context
                                state
                                createdAt
                              }
                            }
                            pageInfo { hasNextPage endCursor }
                          }
                        }
                      }
                    }
                  }
                }' 2>/dev/null || echo "")
            if [ -z "$ROLLUP_PAGES" ] ||
               ! echo "$ROLLUP_PAGES" | jq -e '
                 type == "array"
                 and length > 0
                 and all(
                   .[];
                   (.data.repository.object.statusCheckRollup.contexts.nodes | type)
                     == "array"
                 )' >/dev/null 2>&1; then
              CHECK_RUNS_FAILED="__API_ERROR__"
              CHECK_RUNS_PENDING="__API_ERROR__"
              TOTAL_CHECKS=0
            else
              LATEST_CHECKS=$(echo "$ROLLUP_PAGES" | jq -c '
                [.[].data.repository.object.statusCheckRollup.contexts.nodes[]?]
                | group_by(
                    if .__typename == "CheckRun"
                    then "check:\(.name)"
                    else "status:\(.context)"
                    end
                  )
                | map(
                    sort_by(
                      if .__typename == "CheckRun"
                      then (.startedAt // "")
                      else (.createdAt // "")
                      end
                    )
                    | reverse
                    | .[0]
                  )
                | map(select(
                    if .__typename == "CheckRun" then
                      .name != "Green Gate"
                      and .name != "ping-coderabbit"
                      and (.checkSuite.app.slug // "") != "cursor"
                      and (.checkSuite.app.slug // "") != "coderabbitai"
                    else
                      .context != "Green Gate"
                      and .context != "CodeRabbit"
                      and .context != "Bugbot"
                      and .context != "Cursor"
                    end
                  ))')
              TOTAL_CHECKS=$(echo "$LATEST_CHECKS" | jq 'length')
              CHECK_RUNS_PENDING=$(echo "$LATEST_CHECKS" | jq '
                [.[] | select(
                  (.__typename == "CheckRun" and .status != "COMPLETED")
                  or (.__typename == "StatusContext" and .state == "PENDING")
                )] | length')
              CHECK_RUNS_FAILED=$(echo "$LATEST_CHECKS" | jq '
                [.[] | select(
                  (
                    .__typename == "CheckRun"
                    and .status == "COMPLETED"
                    and (
                      .conclusion != "SUCCESS"
                      and .conclusion != "SKIPPED"
                      and .conclusion != "NEUTRAL"
                    )
                  )
                  or (
                    .__typename == "StatusContext"
                    and .state != "SUCCESS"
                    and .state != "PENDING"
                  )
                )] | length')
              SUCCESS_SIGNATURE=$(echo "$LATEST_CHECKS" | jq -c '
                sort_by(
                  if .__typename == "CheckRun"
                  then "check:\(.name)"
                  else "status:\(.context)"
                  end
                )
                | map({
                    type: .__typename,
                    name: (.name // .context),
                    app: (.checkSuite.app.slug // ""),
                    status,
                    conclusion,
                    state
                  })')
            fi

            echo "  [${ELAPSED}s] total=${TOTAL_CHECKS}, pending=${CHECK_RUNS_PENDING}, failed=${CHECK_RUNS_FAILED}"
            if [ "$TOTAL_CHECKS" -gt 0 ] &&
               [ "$CHECK_RUNS_PENDING" = "0" ] &&
               [ "$CHECK_RUNS_FAILED" = "0" ]; then
              if [ "$SUCCESS_SIGNATURE" = "$LAST_SUCCESS_SIGNATURE" ]; then
                STABLE_SUCCESS_SNAPSHOTS=$((STABLE_SUCCESS_SNAPSHOTS + 1))
              else
                STABLE_SUCCESS_SNAPSHOTS=1
                LAST_SUCCESS_SIGNATURE="$SUCCESS_SIGNATURE"
              fi
              if [ "$STABLE_SUCCESS_SNAPSHOTS" -ge 2 ]; then
                break
              fi
              echo "  Successful snapshot is not stable yet; checking again"
            else
              STABLE_SUCCESS_SNAPSHOTS=0
              LAST_SUCCESS_SIGNATURE=""
            fi
          done

          CI_DETAIL="failed-checks=${CHECK_RUNS_FAILED:-0}, pending-checks=${CHECK_RUNS_PENDING:-0}, total-checks=${TOTAL_CHECKS:-0}"
          if [ "${CHECK_RUNS_FAILED:-}" = "__API_ERROR__" ] ||
             [ "${CHECK_RUNS_PENDING:-}" = "__API_ERROR__" ]; then
            GATE1="FAIL"
            CI_DETAIL="$CI_DETAIL (statusCheckRollup API error)"
            FAILED_GATES="${FAILED_GATES}1, "
          elif [ "${TOTAL_CHECKS:-0}" -eq 0 ]; then
            GATE1="FAIL"
            CI_DETAIL="$CI_DETAIL (no CI checks registered)"
            FAILED_GATES="${FAILED_GATES}1, "
          elif [ "${CHECK_RUNS_FAILED:-0}" -gt 0 ]; then
            GATE1="FAIL"
            FAILED_GATES="${FAILED_GATES}1, "
          elif [ "${CHECK_RUNS_PENDING:-0}" -gt 0 ]; then
            GATE1="FAIL"
            CI_DETAIL="$CI_DETAIL (timeout waiting for CI)"
            FAILED_GATES="${FAILED_GATES}1, "
          else
            GATE1="PASS"
          fi
          echo "Gate 1: $GATE1 ($CI_DETAIL)"
          GATE_ROWS="${GATE_ROWS}| 1. CI green | ${GATE1} | ${CI_DETAIL} |\n"

          # Gate 2: live GitHub mergeability must resolve true.
          MERGEABLE="unknown"
          MERGED_FLAG="false"
          MERGEABLE_STATE="unknown"
          for _attempt in 1 2 3 4 5 6; do
            PR_META=$(gh api repos/${{ github.repository }}/pulls/"$PR_NUM" \
              --jq '{mergeable: .mergeable, mergeable_state: .mergeable_state, merged: .merged}' \
              2>/dev/null || echo '{}')
            MERGEABLE=$(echo "$PR_META" | jq -r 'if .mergeable == null then "unknown" else (.mergeable | tostring) end')
            MERGED_FLAG=$(echo "$PR_META" | jq -r 'if .merged == null then "false" else (.merged | tostring) end')
            MERGEABLE_STATE=$(echo "$PR_META" | jq -r '.mergeable_state // "unknown"')
            if [ "$MERGED_FLAG" = "true" ] || [ "$MERGEABLE" != "unknown" ]; then
              break
            fi
            echo "Mergeability is still unknown; retrying..."
            sleep 10
          done

          if [ "$MERGED_FLAG" = "true" ]; then
            GATE2="PASS"
            GATE2_DETAIL="already merged"
          elif [ "$MERGEABLE" = "true" ]; then
            GATE2="PASS"
            GATE2_DETAIL="mergeable=$MERGEABLE, state=$MERGEABLE_STATE"
          else
            GATE2="FAIL"
            GATE2_DETAIL="mergeable=$MERGEABLE, state=$MERGEABLE_STATE"
            FAILED_GATES="${FAILED_GATES}2, "
          fi
          echo "Gate 2: $GATE2 ($GATE2_DETAIL)"
          GATE_ROWS="${GATE_ROWS}| 2. No conflicts | ${GATE2} | ${GATE2_DETAIL} |\n"

          FAILED_GATES="${FAILED_GATES%, }"
          if [ -z "$FAILED_GATES" ]; then
            OVERALL="PASS"
            RESULT_LINE="**Result: PASS** — both gates green"
          else
            OVERALL="FAIL"
            RESULT_LINE="**Result: FAIL** — gates ${FAILED_GATES} failed"
          fi

          {
            echo "overall=$OVERALL"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

          COMMENT_BODY="## Green Gate — Deterministic 2-Gate Check

          | Gate | Result | Detail |
          |------|--------|--------|
          $(printf '%b' "$GATE_ROWS")

          ${RESULT_LINE}

          VERDICT: ${OVERALL}
          <!-- green-gate-result-${HEAD_SHA} -->
          <!-- HEAD-SHA: ${HEAD_SHA} -->"
          COMMENT_BODY=$(printf '%s\n' "$COMMENT_BODY" | awk '{ sub(/^          /, ""); print }')

          {
            echo "comment_body<<COMMENT_EOF"
            echo "$COMMENT_BODY"
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post gate results comment
        if: always() && steps.gates.outputs.comment_body != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          COMMENT_BODY: ${{ steps.gates.outputs.comment_body }}
        run: |
          PREV_COMMENTS=$(gh api repos/${{ github.repository }}/issues/"$PR_NUM"/comments \
            --paginate \
            --jq '[.[] | select(
              .user.login == "github-actions[bot]"
              and ((.body | test("green-gate-result-")) or (.body | test("Skeptic Gate")))
            ) | .id]' 2>/dev/null || echo "[]")

          for CID in $(echo "$PREV_COMMENTS" | jq -r '.[]' 2>/dev/null); do
            gh api repos/${{ github.repository }}/issues/comments/"$CID" --method DELETE 2>/dev/null || true
          done

          gh api repos/${{ github.repository }}/issues/"$PR_NUM"/comments \
            --field body="$COMMENT_BODY" \
            --jq '.id' > /dev/null 2>&1
          echo "Posted gate results comment on PR #$PR_NUM"

      - name: Set check result
        if: always()
        env:
          OVERALL: ${{ steps.gates.outputs.overall }}
        run: |
          if [ "$OVERALL" = "PASS" ]; then
            echo "Green Gate: PASS"
            exit 0
          fi
          echo "Green Gate: FAIL"
          exit 1
